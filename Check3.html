<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นหาสถานะบิล</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{
  background: linear-gradient(135deg,#f7f1ff,#ffffff);
  font-family: 'Segoe UI',sans-serif;
}
.container{
  max-width:700px;
  margin:50px auto;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(138,43,226,.15);
}
h1{
  color:#6a0dad;
  text-align:center;
}
.search-box{
  display:flex;
  gap:12px;
  margin-top:25px;
}
input{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:2px solid #e0d3ff;
  font-size:1rem;
}
button{
  background:linear-gradient(135deg,#8a2be2,#9370db);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:0 28px;
  font-weight:600;
  cursor:pointer;
}
button:disabled{opacity:.5}
.result{
  display:none;
  margin-top:30px;
  background:#f8f4ff;
  padding:20px;
  border-radius:14px;
}
.label{color:#9370db;font-weight:600}
.value{margin-bottom:12px}
.status{
  display:inline-block;
  padding:6px 18px;
  border-radius:50px;
  font-weight:600;
}
.wait{background:#fff8e1;color:#f57c00}
.done{background:#e6f7e9;color:#2e7d32}
.update{
  margin-top:20px;
}
.message{
  margin-top:15px;
  font-weight:600;
}
</style>
</head>
<body>

<div class="container">
<h1><i class="fas fa-file-invoice"></i> ตรวจสอบสถานะบิล</h1>

<div class="search-box">
  <input id="billNo" placeholder="กรอกเลขที่บิล">
  <button onclick="searchBill()">ค้นหา</button>
</div>

<div id="result" class="result">
  <div><span class="label">เลขที่บิล:</span> <span id="rBill"></span></div>
  <div><span class="label">สถานที่:</span> <span id="rPlace"></span></div>
  <div><span class="label">รายละเอียด:</span> <span id="rDetail"></span></div>
  <div>
    <span class="label">สถานะ:</span>
    <span id="rStatus" class="status"></span>
  </div>

  <div id="updateBox" class="update">
    <label>
      <input type="checkbox" id="confirm">
      ยืนยันการรับบิลแล้ว
    </label>
    <br><br>
    <button id="updateBtn" disabled onclick="updateStatus()">ยืนยันรับบิล</button>
  </div>
</div>

<div id="msg" class="message"></div>
</div>

<script>
const SCRIPT_URL = "PUT_YOUR_SCRIPT_URL_HERE";
let currentBill = null;

document.getElementById("confirm").onchange = e=>{
  document.getElementById("updateBtn").disabled = !e.target.checked;
};

async function searchBill(){
  const billNo = billNo.value.trim();
  if(!billNo) return showMsg("กรุณากรอกเลขที่บิล","red");

  const res = await fetch(`${SCRIPT_URL}?action=search&billNo=${encodeURIComponent(billNo)}`);
  const data = await res.json();

  if(!data.success){
    document.getElementById("result").style.display="none";
    return showMsg(data.message,"red");
  }

  currentBill = billNo;
  document.getElementById("result").style.display="block";
  rBill.textContent = billNo;
  rPlace.textContent = data.place;
  rDetail.textContent = data.detail;

  rStatus.textContent = data.status || "รอรับบิล";
  rStatus.className = "status " + (data.status==="รับบิลแล้ว"?"done":"wait");

  updateBox.style.display = data.status==="รับบิลแล้ว"?"none":"block";
}

async function updateStatus(){
  const res = await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"update",
      billNo:currentBill
    })
  });
  const data = await res.json();

  if(data.success){
    rStatus.textContent="รับบิลแล้ว";
    rStatus.className="status done";
    updateBox.style.display="none";
    showMsg("อัพเดทสถานะเรียบร้อยแล้ว","green");
  }else{
    showMsg(data.message,"red");
  }
}

function showMsg(t,c){
  msg.textContent=t;
  msg.style.color=c;
}
</script>
</body>
</html>
