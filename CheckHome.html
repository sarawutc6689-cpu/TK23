<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูล TK23</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .logo {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #4dabf7;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-button {
            padding: 16px 40px;
            background: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            color: #2a5298;
        }

        .nav-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: #2a5298;
            color: white;
        }

        .nav-button.active {
            background: #2a5298;
            color: white;
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.3);
        }

        .nav-button i {
            font-size: 1.4rem;
        }

        .content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            min-height: 500px;
            transition: all 0.3s ease;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f3f5;
        }

        .page-header h2 {
            font-size: 1.8rem;
            color: #1e3c72;
        }

        .page-header i {
            font-size: 2.5rem;
            color: #4dabf7;
        }

        .iframe-container {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease;
            border-left: 5px solid #4dabf7;
        }

        .stat-card:hover {
            transform: translateY(-8px);
        }

        .stat-card i {
            font-size: 2.5rem;
            color: #2a5298;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 2.2rem;
            color: #1e3c72;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #6c757d;
            font-weight: 500;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input, .form-group select {
            padding: 14px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4dabf7;
        }

        .search-button {
            grid-column: 1 / -1;
            padding: 16px;
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .search-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.3);
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            color: #6c757d;
            font-size: 0.9rem;
            border-top: 1px solid #e9ecef;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #6c757d;
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #4dabf7;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                align-items: center;
            }
            
            .nav-button {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            
            .content {
                padding: 25px;
            }
            
            .dashboard-stats {
                grid-template-columns: 1fr;
            }
            
            .iframe-container {
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 2rem;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .iframe-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <h1>ระบบจัดการข้อมูล TK23</h1>
            <p>ระบบค้นหาและสรุปผลข้อมูลแบบทันสมัย</p>
        </header>
        
        <div class="nav-container">
            <button class="nav-button active" data-page="search">
                <i class="fas fa-search"></i>
                <span>หน้าค้นหา</span>
            </button>
            <button class="nav-button" data-page="dashboard">
                <i class="fas fa-chart-bar"></i>
                <span>หน้าสรุป</span>
            </button>
        </div>
        
        <div class="content">
            <!-- หน้าค้นหา -->
            <div class="page active" id="search-page">
                <div class="page-header">
                    <h2><i class="fas fa-search"></i> หน้าค้นหา</h2>
                    <i class="fas fa-filter"></i>
                </div>
                
                <div class="search-form">
                    <div class="form-group">
                        <label for="search-term"><i class="fas fa-keyword"></i> ค้นหาด้วยคำสำคัญ</label>
                        <input type="text" id="search-term" placeholder="กรุณากรอกคำค้นหา...">
                    </div>
                    
                    <div class="form-group">
                        <label for="search-type"><i class="fas fa-filter"></i> ประเภทการค้นหา</label>
                        <select id="search-type">
                            <option value="all">ทั้งหมด</option>
                            <option value="name">ชื่อ</option>
                            <option value="id">รหัส</option>
                            <option value="date">วันที่</option>
                        </select>
                    </div>
                    
                    <button class="search-button">
                        <i class="fas fa-search"></i> ค้นหาข้อมูล
                    </button>
                </div>
                
                <div class="iframe-container">
                    <iframe id="search-frame" src="https://sarawutc6689-cpu.github.io/TK23/Check3.html" title="หน้าค้นหา"></iframe>
                </div>
            </div>
            
            <!-- หน้าสรุปผล -->
            <div class="page" id="dashboard-page">
                <div class="page-header">
                    <h2><i class="fas fa-chart-bar"></i> หน้าสรุปผล</h2>
                    <i class="fas fa-chart-pie"></i>
                </div>
                
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <h3>1,248</h3>
                        <p>จำนวนผู้ใช้งาน</p>
                    </div>
                    
                    <div class="stat-card">
                        <i class="fas fa-database"></i>
                        <h3>5,672</h3>
                        <p>ข้อมูลทั้งหมด</p>
                    </div>
                    
                    <div class="stat-card">
                        <i class="fas fa-search"></i>
                        <h3>892</h3>
                        <p>การค้นหาในเดือนนี้</p>
                    </div>
                    
                    <div class="stat-card">
                        <i class="fas fa-chart-line"></i>
                        <h3>94%</h3>
                        <p>ประสิทธิภาพระบบ</p>
                    </div>
                </div>
                
                <div class="iframe-container">
                    <iframe id="dashboard-frame" src="https://sarawutc6689-cpu.github.io/TK23/DashBoard.html" title="หน้าสรุปผล"></iframe>
                </div>
            </div>
        </div>
        
        <footer>
            <p>ระบบจัดการข้อมูล TK23 | พัฒนาโดยใช้ HTML, CSS และ JavaScript</p>
            <p>© 2023 All rights reserved.</p>
        </footer>
    </div>

    <script>
        // ฟังก์ชันสำหรับเปลี่ยนหน้า
        function switchPage(pageId) {
            // ซ่อนทุกหน้า
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('active');
            });
            
            // แสดงหน้าที่เลือก
            const activePage = document.getElementById(pageId + '-page');
            activePage.classList.add('active');
            
            // อัปเดตปุ่มที่ active
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(button => {
                button.classList.remove('active');
                if (button.getAttribute('data-page') === pageId) {
                    button.classList.add('active');
                }
            });
            
            // อัปเดต URL ใน iframe ถ้าจำเป็น
            if (pageId === 'search') {
                document.getElementById('search-frame').src = 'https://sarawutc6689-cpu.github.io/TK23/Check3.html';
            } else if (pageId === 'dashboard') {
                document.getElementById('dashboard-frame').src = 'https://sarawutc6689-cpu.github.io/TK23/DashBoard.html';
            }
        }
        
        // เพิ่ม event listener ให้ปุ่ม
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    const pageId = this.getAttribute('data-page');
                    switchPage(pageId);
                });
            });
            
            // จัดการกับ iframe loading
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.addEventListener('load', function() {
                    // สามารถเพิ่ม loading indicator ได้ที่นี่
                    console.log('iframe loaded:', this.src);
                });
            });
            
            // จัดการฟอร์มค้นหา
            const searchForm = document.querySelector('.search-form');
            const searchButton = document.querySelector('.search-button');
            
            searchButton.addEventListener('click', function() {
                const searchTerm = document.getElementById('search-term').value;
                const searchType = document.getElementById('search-type').value;
                
                if (searchTerm.trim() === '') {
                    alert('กรุณากรอกคำค้นหา');
                    return;
                }
                
                // แสดงผลการค้นหา (ในที่นี้เป็นตัวอย่าง)
                alert(`กำลังค้นหา: "${searchTerm}" \nประเภท: ${searchType}`);
                
                // ในสถานการณ์จริง อาจจะส่งคำค้นหาไปยัง iframe หรือ API
            });
            
            // อนุญาตให้กด Enter ในช่องค้นหาได้
            document.getElementById('search-term').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchButton.click();
                }
            });
        });
    </script>
</body>
</html>
